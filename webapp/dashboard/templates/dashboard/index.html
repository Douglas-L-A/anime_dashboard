<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniVision — Anime Dashboard</title>
  <meta name="description" content="Explore e descubra animes com filtros avançados, métricas e visualizações sofisticadas." />

  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}" />
</head>
<body>

  <!-- ✨ Animated Background -->
  <div class="bg-overlay">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>
  </div>

  <!-- 🌐 Header / Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <!-- Toggle sidebar integrado à navbar -->
      <button class="navbar-sidebar-btn" id="sidebarToggle" title="Filtros">
        <span class="nsb-icon nsb-icon-open">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </span>
        <span class="nsb-icon nsb-icon-close hidden">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </span>
      </button>

      <div class="navbar-divider"></div>

      <div class="navbar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="16" stroke="url(#brand-grad)" stroke-width="2.5"/>
            <path d="M10 14 L18 10 L26 14 L26 22 L18 26 L10 22 Z" fill="url(#brand-grad)" opacity="0.85"/>
            <circle cx="18" cy="18" r="4" fill="white"/>
            <defs>
              <linearGradient id="brand-grad" x1="0" y1="0" x2="36" y2="36">
                <stop stop-color="#a855f7"/>
                <stop offset="1" stop-color="#ec4899"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">AniVision</span>
          <span class="brand-sub">Anime Dashboard</span>
        </div>
      </div>
    </div>
    <div class="navbar-meta">
      <div class="status-pill" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Conectado</span>
      </div>
    </div>
  </header>

  <!-- 🏠 Main Layout -->
  <main class="main-layout">

    <!-- 🔎 Sidebar com Filtros -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filtros
        </h2>
      </div>

      <div class="sidebar-body">

        <!-- Género -->
        <div class="filter-group">
          <label class="filter-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            Gênero
          </label>
          <div class="tag-select" id="genreTagSelect">
            <div class="tag-search-wrap">
              <input type="text" class="tag-search" id="genreSearch" placeholder="Buscar gênero…" autocomplete="off" />
            </div>
            <div class="tag-list" id="genreTagList"></div>
          </div>
          <input type="hidden" id="genreFilter" />
        </div>

        <!-- Tipo -->
        <div class="filter-group">
          <label class="filter-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
            Tipo
          </label>
          <div class="chip-group" id="typeChips">
            <button class="chip chip-active" data-value="">Todos</button>
            <button class="chip" data-value="TV">TV</button>
            <button class="chip" data-value="Movie">Filme</button>
            <button class="chip" data-value="OVA">OVA</button>
            <button class="chip" data-value="ONA">ONA</button>
            <button class="chip" data-value="Special">Special</button>
          </div>
          <input type="hidden" id="typeFilter" value="" />
        </div>

        <!-- Temporada -->
        <div class="filter-group">
          <label class="filter-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            Temporada
          </label>
          <div class="chip-group" id="seasonChips">
            <button class="chip chip-active" data-value="">Qualquer</button>
            <button class="chip" data-value="winter">❄️ Inverno</button>
            <button class="chip" data-value="spring">🌸 Primavera</button>
            <button class="chip" data-value="summer">☀️ Verão</button>
            <button class="chip" data-value="fall">🍂 Outono</button>
          </div>
          <input type="hidden" id="seasonFilter" value="" />
        </div>

        <!-- Ano -->
        <div class="filter-group">
          <label class="filter-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Ano
          </label>
          <div class="range-row">
            <div class="range-input-wrap">
              <span class="range-label">De</span>
              <input type="number" id="yearMin" class="range-input" placeholder="1960" min="1960" max="2030" />
            </div>
            <span class="range-sep">—</span>
            <div class="range-input-wrap">
              <span class="range-label">Até</span>
              <input type="number" id="yearMax" class="range-input" placeholder="2025" min="1960" max="2030" />
            </div>
          </div>
        </div>

        <!-- Score -->
        <div class="filter-group">
          <label class="filter-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Pontuação (min)
          </label>
          <div class="score-slider-wrap">
            <input type="range" id="scoreSlider" class="score-slider" min="0" max="10" step="0.1" value="0" />
            <div class="score-slider-labels">
              <span>0</span>
              <span class="score-val-badge" id="scoreValBadge">0.0+</span>
              <span>10</span>
            </div>
          </div>
          <input type="hidden" id="scoreMin" value="0" />
        </div>

        <!-- Ordenação -->
        <div class="filter-group">
          <label class="filter-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Ordenar por
          </label>
          <div class="order-row">
            <select id="orderBy" class="styled-select">
              <option value="rank">Rank</option>
              <option value="score">Score</option>
              <option value="year">Ano</option>
              <option value="title">Título</option>
            </select>
            <div class="chip-group order-dir-chips" id="orderDirChips">
              <button class="chip chip-active" data-value="asc">↑ Asc</button>
              <button class="chip" data-value="desc">↓ Desc</button>
            </div>
          </div>
          <input type="hidden" id="orderDir" value="asc" />
        </div>

        <!-- Ações -->
        <div class="filter-actions">
          <button class="btn-apply" id="applyFilters">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Buscar
          </button>
          <button class="btn-reset" id="resetFilters">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
            Limpar
          </button>
        </div>

      </div>
    </aside>

    <!-- 📌 Content Area -->
    <section class="content-area">

      <!-- 📊 Métricas -->
      <div class="metrics-strip" id="metrics">
        <div class="metric-card" id="metric-total">
          <div class="metric-icon metric-icon-purple">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </div>
          <div class="metric-body">
            <span class="metric-value" id="total-animes">—</span>
            <span class="metric-label">Animes</span>
          </div>
        </div>
        <div class="metric-card" id="metric-score">
          <div class="metric-icon metric-icon-pink">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="metric-body">
            <span class="metric-value" id="avg-score">—</span>
            <span class="metric-label">Score Médio</span>
          </div>
        </div>
        <div class="metric-card" id="metric-year">
          <div class="metric-icon metric-icon-cyan">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="metric-body">
            <span class="metric-value" id="year-range">—</span>
            <span class="metric-label">Período</span>
          </div>
        </div>
        <div class="metric-card" id="metric-page">
          <div class="metric-icon metric-icon-orange">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
          <div class="metric-body">
            <span class="metric-value" id="page-info-metric">—</span>
            <span class="metric-label">Página</span>
          </div>
        </div>
      </div>

      <!-- ⏳ Estado / Loader -->
      <div id="state-message" class="state-message hidden">
        <div class="loader-ring"></div>
        <span id="state-text">Carregando…</span>
      </div>

      <!-- 🎴 Anime Card -->
      <div id="anime-card" class="anime-card">

        <div class="anime-card-poster-wrap">
          <img id="anime-image" src="" alt="Capa do anime" class="anime-poster" />
          <div class="poster-glow"></div>

          <!-- Badge de score -->
          <div class="score-badge" id="score-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span id="badge-score-val">—</span>
          </div>

          <!-- Rank badge -->
          <div class="rank-badge" id="rank-badge">
            <span class="rank-label">#</span><span id="badge-rank-val">—</span>
          </div>
        </div>

        <div class="anime-card-body">
          <div class="anime-card-top">
            <div class="anime-genres-row" id="anime-genres-row"></div>
            <h1 class="anime-title" id="anime-title">—</h1>
            <p class="anime-title-en" id="anime-title-en"></p>
          </div>

          <div class="anime-meta-row" id="anime-meta-row">
            <span class="meta-chip" id="meta-type"></span>
            <span class="meta-chip" id="meta-year"></span>
            <span class="meta-chip" id="meta-season"></span>
            <span class="meta-chip" id="meta-episodes"></span>
            <span class="meta-chip" id="meta-status"></span>
          </div>

          <div class="synopsis-wrap">
            <p class="synopsis-text" id="anime-synopsis">—</p>
          </div>

          <div class="themes-row" id="themes-row"></div>

          <!-- Paginação embutida no card -->
          <div class="pagination-row" id="pagination">
            <button class="nav-btn nav-btn-prev" id="prev-btn" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
              Anterior
            </button>
            <div class="pagination-counter">
              <span id="page-info">—</span>
            </div>
            <button class="nav-btn nav-btn-next" id="next-btn">
              Próximo
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>

      </div>

      <!-- Estado vazio -->
      <div class="empty-state hidden" id="empty-state">
        <div class="empty-icon">🍃</div>
        <p class="empty-title">Nenhum anime encontrado</p>
        <p class="empty-sub">Tente ajustar os filtros para ver resultados.</p>
      </div>

    </section>
  </main>

  <script src="{% static 'dashboard/js/dashboard.js' %}"></script>
</body>
</html>
